<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="可本地部署的 ONLYOFFICE Word 与 Excel 文档库演示">
    <title>ONLYOFFICE 文档库演示</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <a class="brand" href="/" aria-label="ONLYOFFICE 文档库首页">
          <span>ONLYOFFICE</span>
          <small>开源文档学习项目</small>
        </a>
        <nav class="header-links" aria-label="项目导航">
          <a href="/guides">文档中心</a>
          <a href="/guides/quick-start">快速开始</a>
          <a href="https://github.com/mumu976/onlyoffice-document-library">GitHub</a>
        </nav>
        <p id="health-status" class="health-status" role="status" aria-live="polite">
          正在检查服务
        </p>
      </div>
    </header>

    <main class="app-container">
      <section class="welcome" aria-labelledby="welcome-title">
        <div>
          <p class="eyebrow">文档协作工作台</p>
          <h1 id="welcome-title">你的 Word 与 Excel 文档库</h1>
          <p>创建、上传并在浏览器中编辑文档。第一次使用可以先阅读快速开始指南。</p>
        </div>
        <a class="help-link" href="/guides/quick-start">
          <img src="/assets/icons/book-open.svg" alt="">
          查看使用指南
        </a>
      </section>

      <section class="command-bar" aria-label="文档操作与筛选">
        <div class="primary-actions">
          <button id="new-word" class="button button--word" type="button">
            <img src="/assets/icons/plus.svg" alt="">新建 Word
          </button>
          <button id="new-excel" class="button button--excel" type="button">
            <img src="/assets/icons/plus.svg" alt="">新建 Excel
          </button>
          <form id="upload-form" class="upload-form">
            <input id="upload-file" name="file" type="file" accept=".docx,.xlsx" required>
            <button id="upload-trigger" class="button button--secondary" type="button">
              <img src="/assets/icons/upload.svg" alt="">上传文件
            </button>
            <button class="sr-only" type="submit">确认上传</button>
          </form>
        </div>

        <div class="library-controls">
          <label class="search-control" for="search-files">
            <img src="/assets/icons/search.svg" alt="">
            <input id="search-files" type="search" placeholder="搜索文件名称">
          </label>
          <label class="select-control" for="type-filter">
            <span>类型</span>
            <select id="type-filter">
              <option value="all">全部</option>
              <option value="docx">Word</option>
              <option value="xlsx">Excel</option>
            </select>
          </label>
          <label class="select-control" for="sort-files">
            <span>排序</span>
            <select id="sort-files">
              <option value="newest">最近更新</option>
              <option value="oldest">最早更新</option>
              <option value="name">文件名称</option>
            </select>
          </label>
          <div class="view-toggle" aria-label="文件显示方式">
            <button id="view-list" type="button" title="列表视图" aria-label="列表视图" aria-pressed="true">
              <img src="/assets/icons/list.svg" alt="">
            </button>
            <button id="view-grid" type="button" title="卡片视图" aria-label="卡片视图" aria-pressed="false">
              <img src="/assets/icons/grid-2x2.svg" alt="">
            </button>
          </div>
        </div>
      </section>

      <p id="upload-help" class="field-help">正在读取上传限制</p>
      <p id="app-status" class="status-banner" role="status" aria-live="polite" hidden></p>

      <section id="recent-section" class="recent-section" aria-labelledby="recent-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">继续工作</p>
            <h2 id="recent-title">最近文档</h2>
          </div>
        </div>
        <div id="recent-files" class="recent-files" role="list"></div>
      </section>

      <section class="library" aria-labelledby="library-title">
        <div class="section-heading library-heading">
          <div>
            <p class="eyebrow">文件管理</p>
            <h2 id="library-title">全部文档</h2>
          </div>
          <p id="file-count" class="file-count">0 个文档</p>
        </div>

        <div
          id="drop-zone"
          class="drop-zone"
          role="button"
          tabindex="0"
          aria-label="拖放 Word 或 Excel 文件到这里上传"
        >
          <img src="/assets/icons/upload.svg" alt="">
          <strong>拖放文件到这里上传</strong>
          <span>支持 .docx 和 .xlsx，也可以点击“上传文件”选择</span>
        </div>

        <div id="file-list" class="file-collection" data-view="list" role="list"></div>
      </section>
    </main>

    <section id="editor-shell" class="editor-shell" aria-labelledby="editor-title" hidden>
      <header class="editor-toolbar">
        <div class="editor-heading">
          <h2 id="editor-title">文档编辑器</h2>
          <p id="editor-status" role="status" aria-live="polite">正在加载编辑器</p>
        </div>
        <button id="close-editor" class="button button--secondary" type="button">关闭编辑器</button>
      </header>
      <div id="onlyoffice-editor"></div>
    </section>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
